<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Painel do Administrador | Portal Saberes Ancestrais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                clay: '#B85E36',
                ochre: '#D9822B',
                sand: '#F4EAE1',
                dark: '#1C1917',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#1f2e27] text-stone-100 font-sans min-h-screen">
    <header class="bg-brand-dark border-b-4 border-brand-ochre">
      <div
        class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <h1 class="text-lg font-bold text-brand-sand">
          Painel do Administrador
        </h1>
        <div class="flex items-center gap-4 text-sm">
          <span id="admin-user" class="text-stone-300"></span>
          <a href="/" class="text-brand-ochre hover:underline">Ver portal</a>
          <button
            id="logout-btn"
            class="bg-brand-clay hover:bg-brand-ochre text-white px-3 py-1.5 rounded-lg transition"
          >
            Sair
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">
          Agendamentos <span id="total" class="text-stone-400 text-base"></span>
        </h2>
        <button
          id="refresh-btn"
          class="bg-[#263831] hover:bg-[#354f43] border border-[#354f43] text-brand-ochre px-4 py-2 rounded-lg text-sm transition"
        >
          Atualizar
        </button>
      </div>

      <p id="status" class="text-stone-300 text-sm mb-4"></p>

      <div
        class="overflow-x-auto bg-[#263831] border border-[#354f43] rounded-xl"
      >
        <table class="w-full text-sm text-left">
          <thead class="text-stone-300 border-b border-[#354f43]">
            <tr>
              <th class="px-4 py-3">Recebido em</th>
              <th class="px-4 py-3">Nome</th>
              <th class="px-4 py-3">Contato</th>
              <th class="px-4 py-3">Data desejada</th>
              <th class="px-4 py-3">Pessoas</th>
              <th class="px-4 py-3">Experiência</th>
              <th class="px-4 py-3">Restrições</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script>
      const rows = document.getElementById('rows');
      const statusEl = document.getElementById('status');
      const totalEl = document.getElementById('total');

      function formatDateTime(iso) {
        const d = new Date(iso);
        return isNaN(d) ? '' : d.toLocaleString('pt-BR');
      }

      function formatDate(value) {
        const [y, m, d] = String(value || '').split('-');
        return y && m && d ? `${d}/${m}/${y}` : value || '';
      }

      // Usa textContent em tudo: os dados vêm de visitantes e não podem virar HTML.
      function addRow(booking) {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-[#354f43] last:border-0 align-top';
        [
          formatDateTime(booking.dataRegistro),
          booking.nome,
          booking.contato,
          formatDate(booking.data),
          booking.pessoas,
          booking.experiencia,
          booking.restricoes,
        ].forEach((value) => {
          const td = document.createElement('td');
          td.className = 'px-4 py-3';
          td.textContent = value ?? '';
          tr.appendChild(td);
        });
        rows.appendChild(tr);
      }

      async function load() {
        statusEl.textContent = 'Carregando...';
        const res = await fetch('/api/admin/bookings');
        if (res.status === 401) {
          window.location.replace('/login.html');
          return;
        }
        rows.textContent = '';
        if (!res.ok) {
          statusEl.textContent = 'Não foi possível carregar os agendamentos.';
          return;
        }
        const bookings = await res.json();
        bookings.forEach(addRow);
        totalEl.textContent = `(${bookings.length})`;
        statusEl.textContent = bookings.length
          ? ''
          : 'Nenhum agendamento recebido ainda.';
      }

      async function init() {
        const me = await fetch('/api/admin/me');
        if (!me.ok) {
          window.location.replace('/login.html');
          return;
        }
        const { usuario } = await me.json();
        document.getElementById('admin-user').textContent = usuario;
        load();
      }

      document.getElementById('refresh-btn').addEventListener('click', load);
      document
        .getElementById('logout-btn')
        .addEventListener('click', async () => {
          await fetch('/api/admin/logout', { method: 'POST' });
          window.location.replace('/login.html');
        });

      init();
    </script>
  </body>
</html>
